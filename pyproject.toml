[project]
name = "fantasy-quant"
version = "0.1.0"
description = "Professional-grade multi-league fantasy football analyzer. Optimizes championship probability, not projected points."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "pyarrow>=17.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
fq = "fantasy_quant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_quant"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer is designed around calls in argument defaults; B008 is a false positive here.
"src/fantasy_quant/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live external endpoints (deselect with -m 'not network')"]
