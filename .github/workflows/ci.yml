name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests
        # Network tests hit live ESPN endpoints; they run locally, not in CI,
        # so a third-party outage can never redden the build.
        run: uv run pytest -q -m "not network"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: web
      - name: Render tests
        # These mount every view against payloads captured from the live API, so
        # they catch a view that type-checks but throws on real data.
        run: npm test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
